name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
      - frontend-enrollment-feature

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: coursehema35.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t coursehema35.azurecr.io/coursehema-frontend:frontend-feature .
          docker push coursehema35.azurecr.io/coursehema-frontend:frontend-feature
